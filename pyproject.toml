[project]
name = "expyssion"
version = "0.1.0"
description = "expyssion — everything is an expression; everything is a call. A Python-hosted expression language."
readme = "LANGUAGE.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "greenlet>=3.1",
]

[project.scripts]
expy = "expyssion.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.extra-build-dependencies]
expyssion = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/expyssion"]
